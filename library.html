<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library · The 3C Repository</title>
  <meta name="description" content="Search and filter every resource in the 3C Repository by subject, level and format.">
  <script>
    // Apply a saved theme before first paint so there is no flash.
    try { var t = localStorage.getItem('3c-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .lib-head { display: flex; flex-direction: column; gap: 12px; padding: 28px 0 20px; border-bottom: var(--rule-section); }
    .lib-head h1 { font-size: clamp(48px, 7vw, 96px); }
    .controls { display: flex; flex-direction: column; gap: 18px; padding: 20px 0; border-bottom: var(--rule-box); }
    .controls__row { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; }
    .results-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px; padding: 18px 0 6px; border-bottom: var(--rule-box); }
    .results-head .display { font-size: 36px; }
    .clear { border: 0; background: none; color: var(--red-text); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; padding: 8px 0; min-height: var(--target); }
    .more { margin: 24px 0 0; }
    .empty { padding: 40px 0; font-family: var(--font-body); font-size: 20px; font-style: italic; color: var(--muted); }
    .loading { padding: 40px 0; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <a class="masthead__logo" href="index.html" aria-label="3C home"><span class="display">3C</span></a>
      <div class="masthead__title">
        <span class="display">The 3C Repository</span>
        <span class="label muted" id="stamp">Loading…</span>
      </div>
      <nav class="masthead__nav" aria-label="Primary">
        <a href="index.html">Front page</a>
        <a href="library.html" aria-current="page">Library</a>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch colour theme">Dark</button>
      </nav>
    </header>

    <main id="main">
      <section class="lib-head">
        <span class="label red">The library</span>
        <h1 class="display">Everything, searchable</h1>
        <form class="search" role="search" id="search-form">
          <label class="visually-hidden" for="q">Search the library</label>
          <input id="q" type="search" autocomplete="off" placeholder="Search titles, notes and keywords: DFT, AlphaFold, Tao…">
          <button type="submit">SEARCH</button>
        </form>
      </section>

      <section class="controls" aria-label="Filters">
        <div class="controls__row">
          <div class="field">
            <span class="label">View by</span>
            <div class="seg" role="group" aria-label="View by" id="view-chips"></div>
          </div>
          <div class="field">
            <label class="label" for="topic">Topic</label>
            <select class="select" id="topic"></select>
          </div>
        </div>
        <div class="field">
          <span class="label" id="group-label">Group</span>
          <div class="pills" role="group" aria-labelledby="group-label" id="group-chips"></div>
        </div>
        <div class="controls__row">
          <div class="field">
            <span class="label">Level</span>
            <div class="seg" role="group" aria-label="Filter by level" id="level-chips"></div>
          </div>
          <div class="field">
            <span class="label">How do you want to learn?</span>
            <div class="pills" role="group" aria-label="Filter by format" id="format-chips"></div>
          </div>
        </div>
      </section>

      <section aria-labelledby="results-count">
        <div class="results-head">
          <h2 class="display" id="results-count" aria-live="polite">…</h2>
          <button type="button" class="clear" id="clear" hidden>Clear filters</button>
        </div>
        <div id="results"><p class="loading">Loading the library…</p></div>
        <button type="button" class="btn btn--ghost more" id="more" hidden>Show more</button>
      </section>
    </main>

    <footer class="site-footer">
      Entries live in a shared Google Doc and sync here automatically. Subjects and levels are tagged in categories.json.
    </footer>
  </div>

  <script type="module" src="js/library.js"></script>
</body>
</html>
