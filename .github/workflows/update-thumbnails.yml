# .github/workflows/update-thumbnails.yml
#
# WHAT THIS DOES, IN PLAIN TERMS:
#   1. Trigger: runs whenever data.json changes on the main branch
#      (this fires automatically right after the Apps Script pushes).
#   2. Spins up a fresh Ubuntu runner (a temporary, disposable machine).
#   3. Downloads this repo's files onto that machine.
#   4. Installs Node.js and the node-fetch dependency.
#   5. Runs fetch-thumbnails.js, which reads data.json, scrapes any
#      NEW urls not already in thumbnails.json, and updates
#      thumbnails.json. YouTube links go straight to YouTube's own
#      thumbnail CDN (see PLATFORM_STRATEGIES in the script) rather
#      than scraping the watch page, since that page is confirmed to
#      omit its og:image tag specifically when fetched from GitHub
#      Actions' network.
#   6. Commits thumbnails.json back to the repo, but ONLY if it
#      actually changed (so we don't create empty commits every time).
#
# Building the actual website (index.html) and deploying to GitHub
# Pages is a SEPARATE workflow file, added in a later step - this one
# only handles thumbnails, kept deliberately small and single-purpose
# so it's easier to understand and debug on its own.

name: Update Thumbnails

on:
  push:
    branches:
      - main
    paths:
      - "data.json" # only run when data.json actually changes
  # Allows manually triggering this workflow from the Actions tab,
  # against ANY branch you choose in the "Run workflow" dropdown - not
  # just main. Useful for testing changes to the scraper itself (e.g.
  # verifying real behavior against a specific site) without needing to
  # touch data.json or push to main at all.
  workflow_dispatch:

# Gives this workflow permission to commit back to the repo.
# Without this, the "commit thumbnails.json" step would fail with a
# permissions error - GitHub Actions defaults to read-only access.
permissions:
  contents: write

concurrency:
  group: update-thumbnails-main
  cancel-in-progress: false

jobs:
  update-thumbnails:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run thumbnail scraper
        run: |
          cp thumbnails.json /tmp/thumbnails-before.json 2>/dev/null || echo '{}' > /tmp/thumbnails-before.json
          node scripts/fetch-thumbnails.js

      - name: Commit updated thumbnails.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Push to whichever branch actually triggered this run - not
          # a hardcoded "main" - so manual test runs on other branches
          # never touch main.
          
          TARGET_BRANCH="${GITHUB_REF_NAME}"

          # Compute exactly what THIS run changed (new/updated cache
          # entries), then merge that delta onto whatever is CURRENTLY
          # on the target branch, as plain JS objects - rather than
          # relying on git's line-based text merge for this file.
          # thumbnails.json is a keyed JSON cache; two processes
          # rebuilding it from different starting points can produce a
          # file that looks totally different line-by-line even when
          # the underlying data doesn't conflict at all. That mismatch
          # caused a real, CI-unresolvable rebase conflict once already.
          
          cp thumbnails.json /tmp/thumbnails-after.json
          node -e "
            const fs = require('fs');
            const before = JSON.parse(fs.readFileSync('/tmp/thumbnails-before.json', 'utf8'));
            const after = JSON.parse(fs.readFileSync('/tmp/thumbnails-after.json', 'utf8'));
            const delta = {};
            for (const [url, entry] of Object.entries(after)) {
              if (JSON.stringify(before[url]) !== JSON.stringify(entry)) {
                delta[url] = entry;
              }
            }
            fs.writeFileSync('/tmp/thumbnails-delta.json', JSON.stringify(delta));
            console.log('This run changed ' + Object.keys(delta).length + ' cache entries.');
          "

          delta_count=$(node -e "console.log(Object.keys(JSON.parse(require('fs').readFileSync('/tmp/thumbnails-delta.json'))).length)")
          if [ "$delta_count" = "0" ]; then
            echo "No changes to thumbnails.json - skipping commit"
            exit 0
          fi

          max_attempts=5
          attempt=1
          while true; do
            git fetch origin "$TARGET_BRANCH"
            git show "origin/$TARGET_BRANCH:thumbnails.json" > /tmp/thumbnails-remote.json 2>/dev/null || echo '{}' > /tmp/thumbnails-remote.json
            node -e "
              const fs = require('fs');
              const remote = JSON.parse(fs.readFileSync('/tmp/thumbnails-remote.json', 'utf8'));
              const delta = JSON.parse(fs.readFileSync('/tmp/thumbnails-delta.json', 'utf8'));
              const merged = { ...remote, ...delta };
              fs.writeFileSync('thumbnails.json', JSON.stringify(merged, null, 2));
            "

            git reset --soft "origin/$TARGET_BRANCH"
            git add thumbnails.json
            git commit -m "Update thumbnails.json [automated]"

            if git push origin HEAD:"$TARGET_BRANCH"; then
              break
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Push still failing after $max_attempts attempts - giving up."
              exit 1
            fi
            echo "Push rejected (attempt $attempt/$max_attempts) - retrying with a fresh merge..."
            attempt=$((attempt + 1))
            sleep $((attempt * 2))
          done
